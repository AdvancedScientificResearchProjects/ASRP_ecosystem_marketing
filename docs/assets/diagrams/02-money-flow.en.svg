<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Money flow: who pays for what</title>
<desc id="d">Left: clusters that generate value. Right: who pays. R&amp;D and Patents is paid by B2B (licensing, R&amp;D contracts) and B2G / Defense (DoD, VA, government forecasts). GMS meta-cluster is paid by B2G / Defense and by transaction fees (Kapusta.money). Content and Media is paid by Ads and Affiliate (CPM, CPC, Amazon). Edu and Audience and Commerce and Lifestyle are paid by B2C (courses, subscriptions, products). One dashed data flow: Arcanum12th_BOT (dream data) feeds biosensor data into GMS.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='600' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Money flow: who pays for what</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Clusters on the left, revenue sources on the right</text>
