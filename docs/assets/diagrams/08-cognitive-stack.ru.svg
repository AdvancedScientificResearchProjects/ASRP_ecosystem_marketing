<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Стек когнитивного усиления</title>
<desc id="d">Пользователь использует четыре входа, каждый ведёт к ASRP.drift AI (интерпретация и обратная связь): DAAT Crystal (фокусирующий элемент, носится на груди), Inspira-X (интерфейс управляемого дыхания), Neurointerface (ЭЭГ + КГР) и когнитивные команды (ментальные команды, внимание, фокус). ASRP.drift AI ведёт к трём результатам: рабочая память растёт, ментальный шум снижается, контроль внимания растёт.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='560' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Стек когнитивного усиления</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Результаты целевые; полные итоги исследования ожидаются</text>
