<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Измерительная петля DAAT</title>
<desc id="d">Кристалл DAAT (выращен в гиперболическом поле) носится пользователем. Пользователя измеряют четыре датчика: ЭЭГ (гамма / альфа), HRV (когерентность сердце-мозг), КГР (баланс СНС / ПНС) и Inspira-X (респираторный биосенсор). Все четыре идут в ASRP.drift AI (интерпретация), который выдаёт метрики: плюс рабочая память, минус ментальный шум, плюс когнитивная нагрузка. Метрики ведут к премиум B2C + B2B (физлица, топ-менеджмент).</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='520' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Измерительная петля DAAT</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Метрики — целевые результаты; полные итоги исследования ожидаются</text>
