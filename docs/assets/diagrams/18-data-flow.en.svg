<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
<title id="t">ASRP data flow: raw biosignals → analytics → outputs</title>
<desc id="d">Raw-data sources: Arcanum12th courses (extrasensory perception, expanded cognitive perception, TORO, bodybuilding, etc.; students upload on enrolment genetic analysis, EEG, electrodermal GSR, parasympathetic / ANS, medical workup) and Arcanum12th_BOT (dream journal, biosensor stream, geo-distributed, users worldwide). They send raw biological data and the dream and biosensor stream to the analytical layer (AI classification, pattern matching, Kapustin Dream Match Search AI Model, Banchenko Algorithm Extended). Downstream outputs: scientific publications (ResearchGate and journal articles, 8 canonical works), GFS forecasts (geopolitical, markets, geophysical events; sold B2G, B2B, B2C via ASRP Market) and GMS tokens (Mental Objects on QRL, stable neural patterns EEG / MEG / fMRI, tokenised consciousness states; traded on ASRP.exchange / ASRP Market / stock.asrp.*). Prediction outcomes go to the Kapusta rating substrate (motivation, stimulation, filtering), which feeds back: promotes contributors, filters low-quality forecasts, motivates biosensors. Documented in the GFS patent.</desc>
