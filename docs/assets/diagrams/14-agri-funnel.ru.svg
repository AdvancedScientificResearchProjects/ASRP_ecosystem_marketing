<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d">
<title id="t">Агро-исследование → Гранты и продовольственная безопасность</title>
<desc id="d">Воронка из шести шагов в два ряда. 1 Полевые испытания (двойная слепая активация). 2 Дельта объёма 4-й день+ к контролю. 3 Грантовые заявки (UA / MD, восстановление почв после конфликта). 4 Пилот с агрохолдингом. 5 Агрохолдинги и фонды продовольственной безопасности. 6 Роялти-модель — финальная стадия.</desc>
