<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Поток денег: кто за что платит</title>
<desc id="d">Слева кластеры, создающие ценность, справа — кто платит. За R&amp;D и патенты платят B2B (лицензии, R&amp;D-контракты) и B2G / оборонка (DoD, VA, госпрогнозы). За мета-кластер GMS платят B2G / оборонка и комиссии транзакций (Kapusta.money). За контент и медиа — реклама и партнёрка (CPM, CPC, Amazon). За образование и аудиторию и за коммерцию и Lifestyle — B2C (курсы, подписки, товары). Один пунктирный поток данных: Arcanum12th_BOT (данные снов) передаёт биосенсорные данные в GMS.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='600' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Поток денег: кто за что платит</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Слева кластеры, справа источники выручки</text>
