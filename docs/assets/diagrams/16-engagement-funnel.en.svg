<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="t d">
<title id="t">ASRP engagement strategy — open research → LinkedIn → negotiation</title>
<desc id="d">Eight-step funnel in two rows. 1 Reverse engineering (internal competence). 2 Open scientific repo (GitHub + ResearchGate). 3 Peer-preprint publication (preprint / journal). 4 LinkedIn content wave (aligned with target hype). 5 Comment / direct outreach (on target's post). 6 Feedback / inbound (visible signal). 7 Bilateral messaging. 8 Negotiation / contract, the final stage. Two logged cases sit at their current stage, shown as dashed links. Case NSWC IHD (Cardillo), April 2026, LinkedIn comment, feedback pending, at step 6. Case Cortical Labs, 2025-2026, Blood Plasma study, active negotiations, at step 7.</desc>
