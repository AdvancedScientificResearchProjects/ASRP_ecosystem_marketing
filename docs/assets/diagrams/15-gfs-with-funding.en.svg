<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">GFS — forecasts + funding inflows</title>
<desc id="d">Main chain: Arcanum12th_BOT (dream ingest) feeds the geo-tagged biosensor dataset, which feeds the GFS model. The GFS model produces forecasts, which go to two buyer groups: government buyers and private buyers. Funding inflows, shown as a separate dashed group, flow into the GFS model: patrons (asrp.tech/ru/patrons, about $165k cumulative), investors, non-equity (asrp.tech/ru/investors), grants and foundations (research grants), occasional donations (asrp.tech/ru/donate/asrp).</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='700' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>GFS — forecasts + funding inflows</text>
