<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 882" width="1200" height="882" role="img" aria-labelledby="t d">
<title id="t">Frequency ladder of content</title>
<desc id="d">Frequency ladder of content. ASRP.science: Peer-reviewed paper, ~1K readers; ASRP.media: Science-popularising article, ~100K readers; YouTube @ASRPtech: Explainer video, ~1M viewers; TikTok / Shorts / Reels: 30-sec hook, ~10M views; Arcanum12th_BOT: Funnel entry; Arcanum12th.education: Course. Affiliate sale (Amazon affiliate banners).</desc>
