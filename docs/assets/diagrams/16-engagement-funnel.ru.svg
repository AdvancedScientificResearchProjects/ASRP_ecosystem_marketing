<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="t d">
<title id="t">Стратегия аутрича ASRP — открытое исследование → LinkedIn → переговоры</title>
<desc id="d">Воронка из восьми шагов в два ряда. 1 Реверс-инжиниринг (внутренняя компетенция). 2 Открытый научный репозиторий (GitHub + ResearchGate). 3 Научная публикация (препринт / журнал). 4 Волна контента в LinkedIn (в момент хайпа цели). 5 Комментарий / прямой аутрич (под постом цели). 6 Отклик / входящее (видимый сигнал). 7 Двусторонняя переписка. 8 Переговоры / контракт — финальная стадия. Два зафиксированных кейса показаны на текущей стадии пунктирными связями. Кейс NSWC IHD (Cardillo), апрель 2026, комментарий в LinkedIn, отклик ожидается, на шаге 6. Кейс Cortical Labs, 2025–2026, исследование плазмы крови, активные переговоры, на шаге 7.</desc>
