<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Экосистема ASRP</title>
<desc id="d">Сгенерированная иллюстрация, не скриншот продукта. Шесть кластеров (образование, наука, медиа, R&amp;D и deep tech, технологии сознания, коммерция) связаны с одним узлом ASRP; заголовок; три числа из этого репозитория: 8 публикаций, 6 патентных заявок плюс 1 PCT, 4 открытых репозитория исследований.</desc>
