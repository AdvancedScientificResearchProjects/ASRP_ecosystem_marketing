<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">How the pieces fit</title>
<desc id="d">Flow diagram with a text status in every box. Education and audience (Telegram bot: live; Arcanum12th courses: pilot) sends data and attention to R&amp;D and deep tech (studies, patent applications: in development), which sends results to Science and media (papers, open repos, ASRP.media: live). Dashed target arrows: trust and reach from Science and media to Commerce (B2B / B2G, products, licensing: planned) and revenue from Commerce back to R&amp;D. Funding (patrons: active; grants: in pipeline; investors: open) flows into R&amp;D.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='470' rx='18' fill='url(#bg)'/>

<defs><marker id='as' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#4ecdc4'/></marker><marker id='ad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#ffa657'/></marker></defs>
<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>How the pieces fit</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>The project's own model. Every box states its status in words.</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ASRP · ECOSYSTEM</text>
<rect x='46' y='128' width='244' height='136' rx='12' fill='#0b1430' stroke='#34d399' stroke-width='1.6'/>
<text x='62' y='162' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Education and audience</text>
<text x='62' y='188' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Telegram bot · Arcanum12th</text>
<text x='62' y='212' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#34d399' text-anchor='start' font-weight='800'>● LIVE · bot</text>
<text x='62' y='236' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='start' font-weight='800'>◐ PILOT · courses</text>
