<text x='772' y='436' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>пунктирная стрелка: цель, контур ещё не замкнут</text>
