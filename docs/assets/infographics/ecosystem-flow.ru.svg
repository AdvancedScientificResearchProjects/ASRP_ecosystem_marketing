<path d='M1032,268 V342 H508 V270' fill='none' stroke='#ffa657' stroke-width='2.2' stroke-dasharray='7 6' marker-end='url(#ad)'><animate attributeName='stroke-dashoffset' from='26' to='0' dur='1.6s' repeatCount='indefinite'/></path>
<text x='770' y='332' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffa657' text-anchor='middle' font-weight='600'>выручка (цель)</text>
