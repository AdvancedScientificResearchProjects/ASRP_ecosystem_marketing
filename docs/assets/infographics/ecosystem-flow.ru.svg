<text x='888' y='114' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffa657' text-anchor='middle' font-weight='600'>доверие и охват (цель)</text>
<line x1='888' y1='120' x2='888' y2='190' stroke='#2a3b78' stroke-opacity='0.6'/>
<rect x='46' y='308' width='244' height='122' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='62' y='340' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Финансирование</text>
<text x='62' y='366' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#34d399' text-anchor='start' font-weight='800'>● АКТИВНО · меценаты</text>
<text x='62' y='390' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='start' font-weight='800'>◐ В РАБОТЕ · гранты</text>
<text x='62' y='414' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#a78bfa' text-anchor='start' font-weight='800'>○ ОТКРЫТО · инвесторы</text>
<path d='M294,354 H434 V270' fill='none' stroke='#4ecdc4' stroke-width='2.2' marker-end='url(#as)'/>
