<title id="t">Экосистема ASRP: что есть и на какой стадии</title>
<desc id="d">Четыре колонки с текстовыми статусами. Работает (4): Arcanum12th_BOT, ASRP.media, ASRP.science, asrp.tech. В активной разработке (12): Arcanum12th.education, YouTube @ASRPtech, ASRP.art, ASRP.drift (PlayOne), GFS, Global Mental System, Body Food System, Inspira-X, ASRP.dance, ASRP.fashion, DAAT Crystal, ASRP.exchange / ASRP Market. Планируется (3): ASRPshop, субдомен /stock ASRP Market, краудфандинг Inspira-X. Исследовательские репозитории (7): реверс-инжиниринг UAP, плазма крови, агроисследование, дрожжи, исследование DAAT-кристалла, исследование растений, исследование икры рыбы, у каждого стадия как указано в репозитории.</desc>
