<title id="t">ASRP ecosystem: what exists and at what stage</title>
<desc id="d">Four columns with text status labels. Live (4): Arcanum12th_BOT, ASRP.media, ASRP.science, asrp.tech. Active development (12): Arcanum12th.education, YouTube @ASRPtech, ASRP.art, ASRP.drift (PlayOne), GFS, Global Mental System, Body Food System, Inspira-X, ASRP.dance, ASRP.fashion, DAAT Crystal, ASRP.exchange / ASRP Market. Planned (3): ASRPshop, ASRP Market /stock subdomain, Inspira-X crowdfunding. Research studies (7): UAP Reverse Engineering, Blood Plasma, Agricultural, Yeast, DAAT Crystal Study, Plants Study, Fish Caviar Study, each with its stage as stated in the repository.</desc>
